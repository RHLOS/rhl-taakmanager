name: Cache-bust versie bijwerken

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versie-timestamp injecteren in index.html
        run: |
          VERSION=$(date +%Y%m%d%H%M%S)
          sed -i "s/?v=[0-9a-zA-Z_-]*/?v=$VERSION/g" index.html
          echo "Versie ingesteld op: $VERSION"

      - name: Commit en push (als er iets gewijzigd is)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Geen wijziging — skip commit"
          else
            git commit -m "chore: cache-bust versie bijgewerkt [skip ci]"
            git push
          fi
