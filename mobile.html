<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Taken">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <title>Taken — R.H.L.</title>
  <link rel="stylesheet" href="mobile.css?v=4">
</head>
<body>
  <!-- Hoofdscherm: weergave (inbox, vandaag, project, etc.) -->
  <div class="screen" id="screenMain">
    <header class="topbar">
      <button class="menu-btn" id="btnMenu" aria-label="Menu">☰</button>
      <h1 id="viewTitle">Inbox</h1>
      <span class="count" id="viewCount">0</span>
    </header>

    <main class="content">
      <ul class="task-list" id="taskList"></ul>
      <p class="empty" id="emptyState" hidden>Inbox is leeg</p>
    </main>

    <button class="fab" id="fabAdd" aria-label="Nieuwe taak">+</button>
  </div>

  <!-- Menu/sidebar scherm -->
  <div class="screen menu-screen" id="screenMenu" hidden>
    <header class="topbar">
      <button class="menu-btn" id="btnCloseMenu" aria-label="Sluiten">✕</button>
      <h1>Menu</h1>
    </header>

    <nav class="menu-list">
      <button class="menu-item" data-view="inbox">
        <span class="menu-icon">📬</span>
        <span class="menu-label">Inbox</span>
        <span class="menu-count" id="countInbox">0</span>
      </button>
      <button class="menu-item" data-view="vandaag">
        <span class="menu-icon">🔴</span>
        <span class="menu-label">Vandaag &amp; Verlopen</span>
        <span class="menu-count" id="countVandaag">0</span>
      </button>
      <button class="menu-item" data-view="prioriteit">
        <span class="menu-icon">⭐</span>
        <span class="menu-label">Prioriteit</span>
        <span class="menu-count" id="countPrio">0</span>
      </button>
      <button class="menu-item" data-view="voltooid">
        <span class="menu-icon">✅</span>
        <span class="menu-label">Voltooid</span>
        <span class="menu-count" id="countVoltooid">0</span>
      </button>

      <div class="menu-section-title">PROJECTEN</div>
      <div id="projectList"></div>

      <button class="menu-item" data-view="prullenmand">
        <span class="menu-icon">🗑</span>
        <span class="menu-label">Prullenmand</span>
        <span class="menu-count" id="countPrullen">0</span>
      </button>
    </nav>
  </div>

  <!-- Taak-detailscherm -->
  <div class="screen detail-screen" id="screenDetail" hidden>
    <header class="topbar">
      <button class="menu-btn" id="btnBackDetail" aria-label="Terug">←</button>
      <h1 id="detailTitle">Taak</h1>
    </header>

    <main class="content detail-content">
      <div class="detail-section">
        <textarea id="detailName" class="detail-name" rows="2" placeholder="Naam"></textarea>
      </div>

      <div class="detail-section detail-meta">
        <div class="detail-row">
          <span class="detail-label">Deadline</span>
          <input type="date" id="detailDeadline" class="detail-input">
        </div>
        <div class="detail-row">
          <span class="detail-label">Context</span>
          <button type="button" id="detailContextBtn" class="detail-input detail-context-btn">Kies…</button>
        </div>
        <div class="detail-row">
          <span class="detail-label">Prioriteit</span>
          <button type="button" id="detailPrio" class="prio-star" aria-label="Prioriteit togglen">☆</button>
        </div>
      </div>

      <div class="detail-section" id="detailChildSection" hidden>
        <div class="detail-section-head">
          <h3 class="detail-section-title" id="detailChildTitle">Subtaken</h3>
          <button type="button" id="btnAddChild" class="btn-add-child" aria-label="Toevoegen">+</button>
        </div>
        <ul class="task-list" id="detailChildList"></ul>
        <p class="empty" id="detailChildEmpty" hidden>Nog geen items</p>
      </div>

      <div class="detail-section">
        <button type="button" id="btnDetailDelete" class="btn-delete-full">🗑  Verwijderen</button>
      </div>
    </main>
  </div>

  <!-- Modal voor nieuwe taak -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal">
      <h2 id="modalTitle">Nieuwe taak</h2>
      <input type="text" id="newTaskInput" placeholder="Wat moet er gedaan worden?" autocomplete="off">
      <div class="modal-buttons">
        <button class="btn-cancel" id="btnCancel">Annuleren</button>
        <button class="btn-save" id="btnSave">Toevoegen</button>
      </div>
    </div>
  </div>

  <!-- Modal voor context selecteren -->
  <div class="modal-overlay" id="ctxOverlay" hidden>
    <div class="modal">
      <h2>Context</h2>
      <div class="ctx-list" id="ctxList"></div>
      <div class="modal-buttons">
        <button class="btn-cancel" id="btnCtxCancel">Annuleren</button>
        <button class="btn-save" id="btnCtxSave">Opslaan</button>
      </div>
    </div>
  </div>

  <!-- Toast voor feedback -->
  <div class="toast" id="toast" hidden></div>

  <!-- Saving indicator -->
  <div class="saving-indicator" id="savingIndicator" hidden></div>

  <script src="ui.js?v=4"></script>
  <script src="api.js?v=4"></script>
  <script src="mobile.js?v=4"></script>
</body>
</html>
