<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f2f2f7">
  <title>Taakmanager — R.H.L.</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --text-2: #8e8e93;
      --text-3: #aeaeb2;
      --sep: #e5e5ea;
      --accent: #007aff;
      --red: #ff3b30;
      --orange: #ff9500;
      --green: #34c759;
      --yellow: #ffcc00;
      --grey: #8e8e93;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px) 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      padding: 20px 0 8px;
      position: sticky; top: 0;
      background: var(--bg); z-index: 100;
    }
    .header h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
    .header-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }

    /* ── Metrics ── */
    .metrics { display: flex; gap: 8px; margin: 16px 0; }
    .metric {
      flex: 1; min-width: 0; background: var(--card);
      border-radius: 12px; padding: 12px 8px; text-align: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .metric .num { font-size: 24px; font-weight: 700; }
    .metric .lbl {
      font-size: 10px; color: var(--text-2);
      text-transform: uppercase; letter-spacing: .5px; margin-top: 2px;
    }
    .metric.prio .num { color: var(--red); }
    .metric.werk .num { color: var(--accent); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; gap: 6px; margin: 0 0 12px;
      flex-wrap: wrap; align-items: center;
    }
    .toolbar-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .toolbar-sep { width: 1px; height: 20px; background: var(--sep); margin: 0 4px; }
    .fbtn {
      padding: 6px 14px; border-radius: 20px; border: none;
      background: var(--card); color: var(--text-2);
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: all .2s; box-shadow: 0 1px 2px rgba(0,0,0,.06);
      font-family: inherit; white-space: nowrap;
    }
    .fbtn.active { background: var(--accent); color: #fff; }
    .fbtn:hover:not(.active) { background: #e8e8ed; }
    .fbtn.action { background: var(--accent); color: #fff; font-weight: 600; }
    .fbtn.action:hover { background: #006ae6; }
    .fbtn.secondary { background: var(--card); color: var(--text); }
    .fbtn.secondary:hover { background: #e8e8ed; }

    /* ── Table ── */
    .table-wrap {
      background: var(--card);
      border-radius: 13px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      overflow-x: auto;
    }
    table {
      width: 100%; border-collapse: collapse;
      min-width: 900px;
    }
    thead th {
      text-align: left; padding: 10px 8px;
      font-size: 10px; font-weight: 600;
      color: var(--text-2); text-transform: uppercase;
      letter-spacing: .5px; border-bottom: 2px solid var(--sep);
      background: var(--card); position: sticky; top: 0;
      white-space: nowrap; user-select: none;
    }
    tbody td {
      padding: 7px 8px; vertical-align: top;
      border-top: 1px solid var(--sep);
      font-size: 13px;
    }

    /* Kolombreedtes */
    .col-nr { width: 36px; text-align: center; }
    .col-check { width: 32px; text-align: center; }
    .col-cat { width: 40px; text-align: center; }
    .col-project { width: 14%; }
    .col-taak { width: 18%; }
    .col-subtaak { }
    .col-deadline { width: 85px; }
    .col-geschat { width: 70px; }
    .col-werkelijk { width: 60px; }
    .col-context { width: 90px; }
    .col-prio { width: 36px; text-align: center; }

    /* Rij-types */
    tr.row-project td {
      font-weight: 600; font-size: 14px;
      background: rgba(0,0,0,.015);
    }
    tr.row-project td:first-child { border-left: 3px solid transparent; }
    tr.row-project.is-prio td:first-child { border-left-color: var(--red); }
    tr.row-project.is-laag td:first-child { border-left-color: var(--grey); }

    tr.row-taak td { padding-left: 8px; }
    tr.row-subtaak td { font-size: 12px; color: var(--text); }

    tr.collapsed { display: none; }

    tr:hover td { background: rgba(0,122,255,.02); }

    /* Categorie badge */
    .cat {
      font-size: 10px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; display: inline-block; cursor: pointer;
      user-select: none;
    }
    .cat.w { background: rgba(0,122,255,.1); color: var(--accent); }
    .cat.p { background: rgba(255,149,0,.12); color: var(--orange); }

    /* Chevron voor in/uitklappen */
    .chevron {
      display: inline-block; font-size: 10px; color: var(--text-3);
      transition: transform .2s ease; cursor: pointer;
      user-select: none; width: 14px; text-align: center;
    }
    .chevron.open { transform: rotate(90deg); }

    /* Prio ster */
    .star {
      font-size: 16px; cursor: pointer; user-select: none;
      transition: transform .15s; display: inline-block; line-height: 1;
    }
    .star:hover { transform: scale(1.2); }
    .star.on { color: var(--yellow); }
    .star.off { color: var(--sep); }

    /* Checkbox */
    .cb {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--sep); display: inline-flex;
      align-items: center; justify-content: center;
      cursor: pointer; transition: all .2s;
    }
    .cb:hover { border-color: var(--accent); }
    .cb.done { background: var(--green); border-color: var(--green); pointer-events: none; }
    .cb.done::after { content: '\2713'; color: #fff; font-size: 11px; font-weight: 700; }

    /* Deadline */
    .dl { font-size: 11px; font-weight: 500; white-space: nowrap; }
    .dl.urgent { color: var(--red); }
    .dl.normal { color: var(--text-3); }

    /* Context tags */
    .ctx { display: flex; flex-direction: column; gap: 1px; }
    .ctx span {
      font-size: 10px; background: rgba(0,0,0,.05); padding: 1px 5px;
      border-radius: 3px; color: var(--text-2); white-space: nowrap;
    }

    /* Tijd */
    .tijd { font-size: 11px; color: var(--text-2); white-space: nowrap; }

    /* Editable cel */
    .editable { cursor: pointer; border-radius: 3px; padding: 1px 3px; margin: -1px -3px; }
    .editable:hover { background: rgba(0,122,255,.06); }
    .edit-input {
      width: 100%; border: 1px solid var(--accent);
      border-radius: 4px; padding: 2px 4px;
      font-size: inherit; font-family: inherit;
      background: #fff; outline: none;
    }

    /* ── Loading ── */
    .loading { text-align: center; padding: 48px 16px; color: var(--text-2); }
    .spinner {
      width: 24px; height: 24px; border: 3px solid var(--sep);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      text-align: center; padding: 24px 0 16px;
      font-size: 12px; color: var(--text-3);
    }
  </style>
